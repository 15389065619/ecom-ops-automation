[project]
name = "ecom-ops-automation"
version = "0.1.0"
description = "跨境电商运营效率工程 demo：SP-API 取数 -> 清洗算利 -> Excel 报表 -> 飞书告警"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "requests>=2.31"]

[project.optional-dependencies]
spapi = ["python-amazon-sp-api>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
ops-report = "ops_automation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
